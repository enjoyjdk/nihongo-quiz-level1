<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>日本語語彙チャレンジ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">

    <!-- ① スタート画面 -->
    <section id="screen-start" class="screen start">
      <div class="hero" aria-hidden="true">
        <svg viewBox="0 50 600 210" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <g id="blossom">
              <ellipse cx="0" cy="-9" rx="6" ry="9"/>
              <ellipse cx="0" cy="-9" rx="6" ry="9" transform="rotate(72)"/>
              <ellipse cx="0" cy="-9" rx="6" ry="9" transform="rotate(144)"/>
              <ellipse cx="0" cy="-9" rx="6" ry="9" transform="rotate(216)"/>
              <ellipse cx="0" cy="-9" rx="6" ry="9" transform="rotate(288)"/>
              <circle r="3" fill="#ffe27a"/>
            </g>
          </defs>
          <rect width="600" height="260" fill="#cfeaff"/>
          <circle cx="170" cy="138" r="56" fill="#ff8d9a"/>
          <path d="M110 260 L290 70 Q300 60 310 70 L490 260 Z" fill="#5d9be8"/>
          <path d="M255 102 L290 70 Q300 60 310 70 L346 106 L322 96 L308 112 L292 94 L276 110 Z" fill="#fff"/>
          <path d="M0 260 L0 214 Q120 190 250 222 Q420 250 600 208 L600 260 Z" fill="#8fc2f5"/>
          <g fill="#ff9bb8">
            <use href="#blossom" x="62" y="100" transform="scale(1.3)"/>
            <use href="#blossom" x="450" y="80" transform="scale(1.2)"/>
            <use href="#blossom" x="520" y="95"/>
            <use href="#blossom" x="395" y="170" transform="scale(.9)"/>
            <use href="#blossom" x="70" y="195" transform="scale(1.1)"/>
            <use href="#blossom" x="545" y="190" transform="scale(1.4)"/>
          </g>
          <g fill="#ffc2d4">
            <circle cx="30" cy="150" r="4"/><circle cx="130" cy="75" r="5"/>
            <circle cx="360" cy="70" r="4"/><circle cx="480" cy="150" r="5"/>
            <circle cx="215" cy="235" r="4"/><circle cx="590" cy="140" r="4"/>
          </g>
        </svg>
      </div>
      <div class="start-body">
        <h1>日本語<br class="sp-only">語彙チャレンジ</h1>
        <p class="lead">10もん チャレンジ！</p>
        <p class="rule">4つの こたえから、ただしいものを えらんでください。<br>1もん せいかいで 10てん です。</p>
        <button id="btn-start" class="btn primary" type="button">START</button>
      </div>
    </section>

    <!-- ② 問題画面 -->
    <section id="screen-quiz" class="screen quiz" hidden>
      <header class="hud">
        <div class="hud-box">
          <span class="hud-label">SCORE</span>
          <span id="hud-score" class="hud-value">0</span>
        </div>
        <div class="hud-box center">
          <span class="hud-label">QUESTION</span>
          <span class="hud-value"><span id="hud-number">1</span> / <span id="hud-total">10</span></span>
        </div>
        <div class="hud-box right">
          <span class="hud-label">STREAK</span>
          <span class="hud-value"><span id="hud-fire" class="fire" aria-hidden="true"></span><span id="hud-streak">0</span></span>
        </div>
      </header>

      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="10" aria-valuenow="1">
        <div id="progress-bar" class="progress-bar"></div>
      </div>

      <div class="question-card">
        <span id="q-type" class="tag">漢字の よみ</span>
        <h2 id="q-text" class="q-text"></h2>
      </div>

      <div id="choices" class="choices"></div>

      <div id="feedback" class="feedback" aria-live="polite"></div>

      <button id="btn-next" class="btn primary" type="button" disabled>NEXT</button>
    </section>

    <!-- ③ 結果画面 -->
    <section id="screen-result" class="screen result" hidden>
      <h2 class="result-title">おつかれさま！</h2>
      <p class="result-sub">10もん おわりました</p>

      <div class="score-panel">
        <span class="hud-label">TOTAL SCORE</span>
        <p class="big-score"><span id="res-score">0</span><span class="big-of"> / 100</span></p>
        <p id="res-message" class="res-message"></p>
      </div>

      <div class="correct-panel">
        <span class="hud-label">CORRECT</span>
        <span class="correct-value"><span id="res-correct">0</span> / 10</span>
      </div>

      <button id="btn-again" class="btn primary" type="button">PLAY AGAIN</button>
    </section>

  </main>

  <script src="quiz-data.js"></script>
  <script src="script.js"></script>
</body>
</html>
